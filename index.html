<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JANバーコードリーダー</title>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #scanner-container {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* 70%黒マスク ＆ 中央横長クリア枠 */
    .overlay-mask {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7);
    }
    .scan-guide-box {
      position: absolute;
      width: 85%;
      max-width: 360px;
      height: 130px; /* JAN専用 横長比率 */
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      z-index: 10;
    }
    
    /* 四隅の白コーナーマーク */
    .corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: #00ffcc;
      border-style: solid;
      border-width: 0;
    }
    .top-left { top: -2px; left: -2px; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 8px; }
    .top-right { top: -2px; right: -2px; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 8px; }
    .bottom-left { bottom: -2px; left: -2px; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 8px; }
    .bottom-right { bottom: -2px; right: -2px; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 8px; }

    /* レーザー風スキャンラインアニメーション */
    .laser-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, rgba(0,255,204,0) 0%, #00ffcc 50%, rgba(0,255,204,0) 100%);
      top: 50%;
      animation: scanLaser 2s infinite ease-in-out;
    }
    @keyframes scanLaser {
      0% { top: 10%; opacity: 0.2; }
      50% { top: 90%; opacity: 1; }
      100% { top: 10%; opacity: 0.2; }
    }

    /* 下部コントロールエリア */
    .controls {
      height: 130px;
      background: rgba(20, 20, 20, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      gap: 8px;
      z-index: 20;
    }
    .status-text {
      font-size: 14px;
      color: #00ffcc;
      font-weight: bold;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 400px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-cancel {
      background: #444;
      color: #fff;
    }
    .btn-light {
      background: #2c3e50;
      color: #fff;
    }
  </style>
</head>
<body>

  <div id="scanner-container">
    <video id="video" playsinline></video>
    <div class="scan-guide-box">
      <div class="corner top-left"></div>
      <div class="corner top-right"></div>
      <div class="corner bottom-left"></div>
      <div class="corner bottom-right"></div>
      <div class="laser-line"></div>
    </div>
  </div>

  <div class="controls">
    <div class="status-text" id="statusText">JANコードを枠内に収めてください</div>
    <div class="btn-group">
      <button class="btn btn-light" id="btnTorch">ライト OFF</button>
      <button class="btn btn-cancel" id="btnCancel">閉じる</button>
    </div>
  </div>

  <script>
    const codeReader = new ZXing.BrowserMultiFormatReader();
    const videoElem = document.getElementById('video');
    const statusText = document.getElementById('statusText');
    const btnCancel = document.getElementById('btnCancel');
    const btnTorch = document.getElementById('btnTorch');

    let currentStream = null;
    let torchState = false;

    // JAN専用ヒント設定（EAN-13, EAN-8, UPC-A, UPC-E）
    const hints = new Map();
    const formats = [
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E
    ];
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);

    // カメラ起動
    async function startScanner() {
      try {
        const videoInputDevices = await codeReader.listVideoInputDevices();
        // 背面カメラを優先選択
        let selectedDeviceId = undefined;
        const backCamera = videoInputDevices.find(device => /back|rear|environment/i.test(device.label));
        if (backCamera) {
          selectedDeviceId = backCamera.deviceId;
        }

        codeReader.decodeFromConstraints({
          video: {
            deviceId: selectedDeviceId ? { exact: selectedDeviceId } : undefined,
            facingMode: selectedDeviceId ? undefined : { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 },
            focusMode: { ideal: 'continuous' }
          }
        }, videoElem, (result, err) => {
          if (result) {
            handleScanSuccess(result.getText());
          }
        });

      } catch (err) {
        console.error(err);
        statusText.innerText = "カメラ起動エラー: " + err.message;
      }
    }

    // 読み取り成功時の処理
    function handleScanSuccess(code) {
      // 成功バイブレーション（対応機種のみ）
      if (navigator.vibrate) navigator.vibrate(100);

      statusText.innerText = "読取完了: " + code;
      
      // 親ウィンドウ（GAS側）へデータを送信
      if (window.opener) {
        window.opener.postMessage({ type: 'BARCODE_SCANNED', code: code }, '*');
        setTimeout(() => window.close(), 300);
      } else {
        // 直接開かれた場合のフォールバック（アラート表示後再開）
        alert("JANコード: " + code);
      }
    }

    // 閉じるボタン
    btnCancel.addEventListener('click', () => {
      if (window.opener) {
        window.close();
      } else {
        history.back();
      }
    });

    // ライト（トーチ）制御
    btnTorch.addEventListener('click', async () => {
      try {
        if (!videoElem.srcObject) return;
        const track = videoElem.srcObject.getVideoTracks()[0];
        const capabilities = track.getCapabilities();
        if (capabilities.torch) {
          torchState = !torchState;
          await track.applyConstraints({ advanced: [{ torch: torchState }] });
          btnTorch.innerText = torchState ? "ライト ON" : "ライト OFF";
          btnTorch.style.backgroundColor = torchState ? "#e67e22" : "#2c3e50";
        } else {
          alert("この端末はライト制御に対応していません");
        }
      } catch (e) {
        console.warn("Torch failed", e);
      }
    });

    window.addEventListener('load', startScanner);
  </script>
</body>
</html>
